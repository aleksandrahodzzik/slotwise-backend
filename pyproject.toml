[project]
name = "slotwise"
version = "0.1.0"
description = "Concurrency-safe slot booking API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.14",
  "asyncpg>=0.30",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "pydantic-settings>=2.6",
  "pydantic>=2.10",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slotwise"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not naive'"
markers = [
  "naive: nondeterministic demo of a race; excluded from CI",
]

[tool.coverage.run]
source = ["slotwise"]
branch = true

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares dependencies in argument defaults.
"src/slotwise/api/routes.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["slotwise"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
